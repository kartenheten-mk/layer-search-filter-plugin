name: Build and package the layer search plugin
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Klona repot
        uses: actions/checkout@v5
      - name: Sätt upp Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Installera beroenden
        run: npm install
      - name: Bygg projektet
        run: npm run build
      - name: Packa artefakter (build)
        uses: actions/upload-artifact@v6
        with:
          name: layersearch-built-assets
          path: build/
